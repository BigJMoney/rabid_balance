# -----

# Global Policy Doc Example

# This is a context category
realm:
  # This is a context value
  Underworld:
    # We can allow, disallow, favor or disfavor both kinds of loot (mechanical) or affinities (thematic)
    allow: [material, tool, utility]
    disallow: [sea]
    favor: [underground, deep_underground]
    disfavor: [smithing]


# This is just an example of another category
activity:
  Mining:
    allow: [material, tool]
    # disallow isn't used, so it doesn't need to be specified
    favor: [smithing, treasure]
    disfavor: [farming, fishing]

    # This is an example of controlling how the buckets are combined in this block
    #  It is optional, and the default values are shown
    #  (union, intersection, difference, symmetric difference)

    # allow_method: union
    # disallow_method: union
    # favor_method: union
    # disfavor_method: union

# ----

# Loot Context Profile Example (Several per doc, organizable by files/dirs)

- id: abandoned_mineshaft

  realm: underworld
  activity: mining
  structure_class: dungeon

  value_table: uncommon_loot
  rolls: [3, 10]
  
  min_slots_by_tag:
    gather_tool: 2
    food: 3
    wooden: 4

  min_slots_by_explicit_match:
    "minecraft:apple": 1

  max_slots_by_tag:
    gather_tool: 2
    food: 3
    wooden: 4

  max_slots_by_explicit_match:
    "*_planks": 3
    "#c:logs": 3

  max_dupes_per_item_by_tag:
    gather_tool: 1
    block_material: 1
    food: 3

  max_dupes_per_item_global: 1

  amount_by_function:
    food: tiny
    item_material: large
    block_material: large

  amount_by_match:
    "c:logs": small

  replaces: minecraft:chests/simple_dungeon
  random_sequence: minecraft:chests/spawn_bonus_chest


