        - minecraft:repeating_command_block
        - minecraft:structure_block
        - minecraft:jigsaw
        - minecraft:debug_stick
        - minecraft:barrier
        - minecraft:light
        - minecraft:structure_void
        - minecraft:bedrock
        - minecraft:end_portal_frame
        - minecraft:spawner
        - minecraft:trial_spawner
        - minecraft:vault
        - minecraft:dragon_egg
        - minecraft:knowledge_book
        - minecraft:suspicious_gravel
        - minecraft:suspicious_sand
        - minecraft:dirt_path
        - minecraft:farmland
        - minecraft:frogspawn
        - minecraft:chorus_plant
        - gravestone:gravestone
        - gravestone:obituary
        - "*_spawn_egg"
        - "sculk*"                                # Change when Apotheosis is added if it doesn't add them globally (actually I think it does)
      assign:
        value:
          default: none
        function: nonloot
        amount_class:
          default: singleton
      reason: >
        Admin/debug/unobtainable/problematic items that should not enter ordinary survival loot.

    - id: garden_items
      priority: 90
      match:
        - minecraft:potato
        - minecraft:sugar_cane
        - minecraft:bamboo
        - minecraft:cocoa_beans
        - minecraft:nether_sprouts
        - minecraft:glow_berries
        - minecraft:chorus_flower
        - upgrade_aquatic:pickerelweed
        - "*_seeds"
        - "#minecraft:saplings"
      assign:
        function: garden
        value:
          default: uncommon
          rare:
            - minecraft:chorus_flower
        amount_class:
          default: small
      reason: >
        Things that can be planted and grow.

    - id: consumable_items
      priority: 85
      match:
        - minecraft:ender_pearl
        - minecraft:ominous_bottle
        - minecraft:wind_charge
        - minecraft:fire_charge
        - minecraft:totem_of_undying
        - minecraft:experience_bottle
        - minecraft:ender_eye
        - minecraft:tnt
        - minecraft:firework_rocket
        - minecraft:firework_star
        - minecraft:sponge
        - minecraft:wet_sponge
        - minecraft:name_tag
        - minecraft:bone_meal
        - minecraft:trial_key
        - minecraft:ominous_trial_key
        - bosses_of_mass_destruction:soul_star
        - "#c:potions"                  # specific rules needed for generated instances? (lots of other places like this)
        - "#c:foods"
        - "#endermanoverhaul:ender_pearls"
      assign:
        function: consumable
        value:
          default: common
          unique:
            - minecraft:ominous_bottle
            - minecraft:ominous_trial_key
          junk:
            - minecraft:rotten_flesh
          legendary:
            - minecraft:totem_of_undying
            - minecraft:ender_eye
          epic:
            - minecraft:enchanted_golden_apple
            - minecraft:firework_star
            - minecraft:trial_key
            - "#endermanoverhaul:ender_pearls"
          rare:
            - minecraft:golden_carrot
            - minecraft:golden_apple
            - minecraft:ender_pearl
            - minecraft:wind_charge
            - minecraft:fire_charge
            - minecraft:tnt
            - minecraft:firework_rocket
            - minecraft:name_tag
            - minecraft:sponge
            - minecraft:wet_sponge
            - minecraft:chorus_fruit
            - bosses_of_mass_destruction:soul_star
            - "#c:potions"
          uncommon:
            - minecraft:experience_bottle
        amount_class:
          default: small
          tiny:
            - minecraft:golden_carrot
            - minecraft:golden_apple
          singleton:
            - minecraft:enchanted_golden_apple
      reason: >
        Most food is ordinary sustain. Special-effect food deserves stronger rarity and smaller amounts.

    - id: wearable_equipment
      priority: 80
      match:
        - minecraft:wolf_armor
        - minecraft:elytra
        - minecraft:saddle
        - toolbelt:belt
        - "*_horse_armor"
        - "*_head"
        - "*backpack"                           # Sophisticated Backpacks
        - "#c:armors"
        - "#c:tools/shield"
        - "#minecraft:harnesses"
