# Value Weight Tables Doc Example

-id: common_loot
  junk: 0.05
  filler: 0.25
  common: 1
  uncommon: 0.25
  rare: 0.025
  epic: 0.005

-id: uncommon_loot
  junk: 0.05
  filler: 0.1
  common: 0.5
  uncommon: 0.75
  rare: 0.075
  epic: 0.005

# ----

# The below examples are old versions of loot context tables that don't use
#  a global policy document. I'm keeping them here for posterity, and perhaps
#  as an example of how to do a manual override of the global table

# ----

# Style A (Canonical Model)
id: abandoned_mineshaft

  # allow, disallow, favor and disfavor are all allowed in both blocks
  context:
    allow:
      realm: underworld
      activity: mining
    favor:
      structure_class: treasure_hoard
    disfavor:
      activity: smithing

  kind:
    allow: [material, tool, utility]
    disallow: [cosmetic, combat]

  # An external scheme defines all value tables
  value_table: uncommon_loot

  # Optional; defaults are shown here
  # allow_method: union     
  # filter_method: union    
  # favor_weight: 2         
  # disfavor_weight: 0.5

----

# Style B (Actual Authored Syntax)
id: abandoned_mineshaft

  context:
    realm: underworld                   # all simple values comprise the allowed bucket
    activity: [mining, "-smithing"]     # -values are part of disfavored weighting
    structure_class: "+treasure_hoard"  # +values are part of favored weighting

  kind:
    - material
    - tool
    - utility
    - "!cosmetic"                       # !values comprise the disallowed bucket
    - "!combat"

  # An external scheme defines all value tables
  value_table: uncommon_loot

  # Optional; defaults are shown here
  # allow_method: union     
  # filter_method: union    
  # favor_weight: 2         
  # disfavor_weight: 0.5

