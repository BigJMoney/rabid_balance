loot_classification:
  version: 8

  # Buckets of power and/or exclusivity (which go hand-in-hand in MC)
  value:
    - none                  # Never place; none:nonloot
    - junk
    - filler
    - common
    - uncommon
    - rare
    - epic
    - unique                # Hand placed only

  kind:
    - nonloot               # Never place; none:nonloot
    - block_storage
    - block_functional      # todo: consider "block_crafting" or "block_output"
    - block_technical       # todo: consider splitting up
    - block_utility
    - cosmetic              # items and blocks
    - plantable
    - food                  # todo: DO change to consumable
    # - food_ingredients ?
    - magic                 # todo: DO split up
    - combat                # todo: consider equipment
    - tool                  # todo: consider equipment
    - material
    - utility               # todo: consider spliting up
    - block_building
    - block_raw             # todo: consider consolidating (think mechanical purpose)
    - block_junk            # todo: consider consolidating (think mechanical purpose)
    - unmatched

  amount_ranges:
    singleton: [1, 1]
    tiny: [1, 2]
    small: [2, 5]
    medium: [4, 8]
    large: [6, 16]
    bulk: [24, 64]
    chaotic: [1, 64]

  amount_policy:
    summary: >
      Amount is resolved separately from appearance weight. Each item gets a base
      amount_class, then context may optionally modify it, and hard caps can clamp
      the result for special items.
    resolution_order:
      - base amount_class from item rule
      - optional context modifier by location / structure / danger / budget
      - hard caps for singleton or progression-sensitive items

  rules:
    - id: excluded_items
      priority: 100
      match:
        - minecraft:budding_amethyst
        - minecraft:command_block
        - minecraft:chain_command_block
        - minecraft:repeating_command_block
        - minecraft:structure_block
        - minecraft:jigsaw
        - minecraft:debug_stick
        - minecraft:barrier
        - minecraft:light
        - minecraft:structure_void
        - minecraft:bedrock
        - minecraft:end_portal_frame
        - minecraft:spawner
        - minecraft:trial_spawner
        - minecraft:vault
        - minecraft:dragon_egg
        - minecraft:knowledge_book
        - minecraft:suspicious_gravel
        - minecraft:suspicious_sand
        - minecraft:dirt_path
        - minecraft:farmland
        - minecraft:frogspawn
        - "*_spawn_egg"
        - "sculk*"                                # Change when Apotheosis is added if it doesn't add them globally (actually I think it does)
      assign:
        value:
          default: none
        kind: nonloot
        amount_class:
          default: singleton
      reason: >
        Admin/debug/unobtainable/problematic items that should not enter ordinary survival loot.

    - id: block_storage
      priority: 90
      match:
        - minecraft:chest
        - minecraft:trapped_chest
        - minecraft:barrel
        - minecraft:ender_chest
        - minecraft:shulker_box
        - "*_shulker_box"
      assign:
        kind: block_storage
        value:
          default: common
          rare:
            - minecraft:trapped_chest
          epic:
            - minecraft:ender_chest
            - minecraft:shulker_box
            - "*_shulker_box"
        amount_class: 
          default: singleton
      reason: >
        Storage blocks are placeable, but their gameplay meaning is storage expansion, not generic block filler.

    - id: block_functional
      priority: 80
      match:
        - minecraft:campfire
        - minecraft:soul_campfire
        - minecraft:crafting_table
        - minecraft:furnace
        - minecraft:smoker
        - minecraft:blast_furnace
        - minecraft:brewing_stand
        - minecraft:cauldron
        - minecraft:enchanting_table
        - minecraft:anvil
        - minecraft:chipped_anvil
        - minecraft:damaged_anvil
        - minecraft:cartography_table
        - minecraft:fletching_table
        - minecraft:smithing_table
        - minecraft:grindstone
        - minecraft:stonecutter
        - minecraft:loom
        - minecraft:lectern
        - minecraft:composter
        - minecraft:bee_nest
        - minecraft:beehive
        - minecraft:lodestone
        - minecraft:beacon
        - minecraft:respawn_anchor
        - minecraft:bell
      assign:
        kind: block_functional
        value:
          default: rare
          uncommon:
            - minecraft:campfire
            - minecraft:crafting_table
            - minecraft:furnace
            - minecraft:smoker
            - minecraft:damaged_anvil
            - minecraft:stonecutter
            - minecraft:composter
          epic:
            - minecraft:enchanting_table
            - minecraft:beehive
            - minecraft:soul_campfire
            - minecraft:anvil
          unique:
            - minecraft:bee_nest
            - minecraft:beacon
            - minecraft:respawn_anchor
        amount_class:
          default: singleton
      reason: >
        Functional blocks unlock capabilities or systems and should usually appear as single meaningful finds.

    - id: block_technical
      priority: 70
      match:
        - minecraft:redstone_torch
        - minecraft:repeater
        - minecraft:comparator
        - minecraft:piston
        - minecraft:sticky_piston
        - minecraft:observer
        - minecraft:hopper
        - minecraft:dispenser
        - minecraft:dropper
        - minecraft:target
        - minecraft:lever
        - minecraft:lightning_rod
        - minecraft:daylight_detector
        - minecraft:calibrated_sculk_sensor
        - minecraft:tripwire_hook
        - minecraft:redstone_lamp
        - minecraft:note_block
        - minecraft:powered_rail
        - minecraft:detector_rail
        - minecraft:rail
        - minecraft:activator_rail
        - minecraft:crafter
        - minecraft:copper_bulb
        - minecraft:redstone_block
        - "*_button"
        - "*_pressure_plate"
        - "*_copper_bulb"
      assign:
        kind: block_technical
        value:
          default: rare
          common:
            - minecraft:rail
          uncommon:
            - minecraft:lever
            - minecraft:redstone_torch
            - minecraft:tripwire_hook
            - minecraft:powered_rail
            - "*_button"
            - "*_pressure_plate"
          epic:
            - minecraft:calibrated_sculk_sensor
            - minecraft:crafter
        amount_class:
          default: singleton
          tiny:
            - minecraft:tripwire_hook
            - minecraft:redstone_block
          small:
            - minecraft:redstone_torch
            - minecraft:redstone_lamp
            - minecraft:copper_bulb
          medium:
            - minecraft:powered_rail
            - minecraft:detector_rail
            - minecraft:activator_rail
          large:
            - minecraft:rail
      reason: >
        Technical blocks are not junk; they enable redstone and logistics systems and should be controlled accordingly.

    - id: block_utility
      priority: 60
      match:
        - minecraft:torch
        - minecraft:soul_torch
        - minecraft:lantern
        - minecraft:soul_lantern
        - minecraft:ladder
        - minecraft:scaffolding
        - minecraft:flower_pot
        - minecraft:end_rod
        - minecraft:bookshelf
        - minecraft:candle
        - "*_door"
        - "*_trapdoor"
        - "*_fence_gate"
        - "*_sign"
        - "*_hanging_sign"
        - "*_bed"
        - "*_candle"
        - "*_froglight"
      assign:
        kind: block_utility
        value:
          default: uncommon
          common:
            - minecraft:torch
            - minecraft:ladder
          rare:
            - minecraft:bookshelf
          epic:
            - "*_froglight"
        amount_class:
          default: small
          singleton:
            - minecraft:bookshelf
            - "*_bed"
      reason: >
        These are placeable but meaningfully useful; classify by behavior rather than by mere block form.

    - id: cosmetic_items
      priority: 40
      match:
        - minecraft:painting
        - minecraft:item_frame
        - minecraft:glow_item_frame
        - minecraft:armor_stand
        - minecraft:decorated_pot
        - minecraft:goat_horn
        - minecraft:jukebox
        - minecraft:chain
        - minecraft:sea_lantern
        - minecraft:sea_pickle
        - minecraft:shroomlight
        - minecraft:glowstone
        - "*_banner"
        - "*_head"            
        - "music_disc_*"
        - "disc_fragment_*"
        - "*_banner_pattern"
        - "*_pottery_sherd"
        - "*_carpet"
        - "#minecraft:skulls"
        - "#c:pumpkins"
      assign:
        kind: cosmetic
        value:
          default: uncommon
          rare:
            - minecraft:sea_lantern
            - minecraft:glow_item_frame
            - "*_banner_pattern"
          epic:
            - minecraft:wither_skeleton_skull
            - "*_head"
          unique:
            - minecraft:dragon_head
        amount_class:
          default: singleton
      reason: >
        Collectible, expressive, or prestige items should usually appear as singleton finds.

    - id: plantable_items
      priority: 16
      match:
        - minecraft:potato
        - minecraft:sugar_cane
        - minecraft:bamboo
        - minecraft:cocoa_beans
        - minecraft:nether_sprouts
        - minecraft:glow_berries
        - "*_seeds"
        - "#minecraft:saplings"
      assign:
        kind: plantable
        value:
          default: uncommon
        amount_class:
          default: small
      reason: >
        Things the player can plant.

    - id: magic_items                   # todo: consider breaking this up and having
      priority: 35                      #  an arcane affinity instead
      match:
        - minecraft:ender_pearl
        - minecraft:blaze_rod
        - minecraft:ghast_tear
        - minecraft:totem_of_undying
        - minecraft:potion              # specific rules needed for generated instances? (lots of other places like this)
        - minecraft:splash_potion
        - minecraft:lingering_potion
        - minecraft:experience_bottle
        - minecraft:ominous_bottle
        - minecraft:echo_shard
        - minecraft:enchanted_book
        - minecraft:wind_charge
        - minecraft:fire_charge
        - minecraft:breeze_rod
        - minecraft:ender_eye
        - minecraft:recovery_compass
      assign:
        kind: magic
        value:
          default: rare
          epic:
            - minecraft:totem_of_undying
            - minecraft:ender_eye
            - minecraft:echo_shard
          unique:
            - minecraft:recovery_compass
            - minecraft:ominous_bottle
        amount_class:
          default: small
          tiny:
            - minecraft:ghast_tear
            - minecraft:ender_eye
            - minecraft:echo_shard
          singleton:
            - minecraft:enchanted_book
            - minecraft:totem_of_undying
            - minecraft:recovery_compass
      reason: >
        Magic and progression items should be tightly controlled by both rarity and amount.

    - id: food_items
      priority: 30
      match:
        - "cooked_*"
        - "*_stew"
        - "#c:foods"  # todo: go through these
      assign:
        kind: food
        value:
          default: common
          junk:
            - minecraft:rotten_flesh
          rare:
            - minecraft:golden_carrot
            - minecraft:golden_apple
          epic:
            - minecraft:enchanted_golden_apple
        amount_class:
          default: small
          tiny:
            - minecraft:golden_carrot
            - minecraft:golden_apple
          singleton:
            - minecraft:enchanted_golden_apple
      reason: >
        Most food is ordinary sustain. Special-effect food deserves stronger rarity and smaller amounts.

    - id: combat_items
      priority: 25
      match:
        - minecraft:bow
        - minecraft:crossbow
        - minecraft:shield
        - minecraft:trident
        - minecraft:mace
        - minecraft:arrow
        - minecraft:spectral_arrow
        - minecraft:tipped_arrow
