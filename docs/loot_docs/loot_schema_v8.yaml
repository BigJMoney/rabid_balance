        Utility items are useful but not all are progression-breaking. Durable or high-impact utility should usually be singleton.

    - id: block_building
      priority: 50
      match:
        - minecraft:terracotta
        - minecraft:concrete
        - minecraft:amethyst_block
        - minecraft:quartz_block
        - "*_slab"
        - "*_stairs"
