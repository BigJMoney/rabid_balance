loot_classification_by_trait:
  
  version: 10

  # Buckets of power and/or exclusivity (which go hand-in-hand in MC)
  value:
    - none                  # Never place; none/nonloot
    - unique                # Hand placed only
    - junk
    - filler
    - legendary             # Almost never get
    - epic                  # Small multiplier of rare (e.g. 2x, 5x, etc)
    - rare
    - uncommon
    - common

  function:
    - nonloot               # Never place; none/nonloot
    - garden
    - consumable
    - wearable
    - weapon
    - gather_tool
    - misc_tool
    - item_material
    - block_storage
    - block_crafting
    - block_technical
    - block_misc_use
    - block_material
    - block_building
    - ignore
    - unmatched

  amount_ranges:
    singleton: [1, 1]
    tiny: [1, 2]
    small: [2, 5]
    medium: [4, 8]
    large: [6, 16]
    bulk: [24, 64]
    chaotic: [1, 64]

  amount_policy:
    summary: >
      Amount is resolved separately from appearance weight. Each item gets a base
      amount_class, then context may optionally modify it, and hard caps can clamp
      the result for special items.
    resolution_order:
      - base amount_class from item rule
      - optional context modifier by location / structure / danger / budget
      - hard caps for singleton or progression-sensitive items

  ignored_items:
