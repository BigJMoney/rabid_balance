      assign:
        value:
          default: filler
          rare:
            - minecraft:amethyst_block
            - "quartz*"
        kind: block_building
        amount_class: 
          default: large
      reason: >
        Structural or decorative blocks that are somewhat useful filler

    - id: block_raw
      priority: 45
