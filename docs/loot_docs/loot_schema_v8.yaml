      assign:
        kind: material
        value:
          default: rare
          common:
            - minecraft:coal
            - minecraft:charcoal
            - minecraft:glass
            - minecraft:glass_pane
            - minecraft:clay_ball
            - minecraft:brick
            - minecraft:string
