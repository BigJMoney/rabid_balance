            - "chainmail_*"
            - "copper_*"                        # Vanilla Backport
            # - "#golden"
            # - "#chainmail"
          common:
            - toolbelt:belt
            - "leather_*"
            - "wooden_*"                        # Immersive Armors
            # - "#leather"
        amount_class:
          default: singleton
      reason: >
        Equipment that can be worn by the player or a mob.

    - id: weapons
