loot_classification:
  version: 8

  value:                    # Buckets of value, power and exclusivity
    - none                  # Never place; none:nonloot
    - junk
    - filler
    - common
    - uncommon
    - rare
    - epic
    - unique                # Hand placed only

  kind:
    - nonloot               # Never place; none:nonloot
    - block_storage
    - block_functional
    - block_technical
    - block_utility
    - cosmetic              # items and blocks
    - food
    # - food_ingredients ?
    - magic
    - combat
    - tool
    - material
    - plantable
    - utility
    - block_building
    - block_raw
    - block_junk
    - unmatched

  amount_ranges:
    singleton: [1, 1]
    tiny: [1, 2]
    small: [2, 5]
    medium: [4, 8]
    large: [6, 16]
    bulk: [24, 64]
    chaotic: [1, 64]

  amount_policy:
    summary: >
      Amount is resolved separately from appearance weight. Each item gets a base
      amount_class, then context may optionally modify it, and hard caps can clamp
      the result for special items.
    resolution_order:
      - base amount_class from item rule
      - optional context modifier by location / structure / danger / budget
      - hard caps for singleton or progression-sensitive items

  rules:
    - id: excluded_items
      priority: 100
      match:
        - minecraft:budding_amethyst
        - minecraft:command_block
        - minecraft:chain_command_block
        - minecraft:repeating_command_block
        - minecraft:structure_block
        - minecraft:jigsaw
        - minecraft:debug_stick
        - minecraft:barrier
        - minecraft:light
        - minecraft:structure_void
        - minecraft:bedrock
        - minecraft:end_portal_frame
        - minecraft:spawner
        - minecraft:trial_spawner
        - minecraft:vault
        - minecraft:dragon_egg
        - minecraft:knowledge_book
        - "*_spawn_egg"
        - "sculk*"                                # Change when Apotheosis is added if it doesn't add them globally (actually I think it does)
      assign:
        value:
          default: none
        kind: nonloot
        amount_class:
          default: singleton
      reason: >
        Admin/debug/unobtainable/problematic items that should not enter ordinary survival loot.

    - id: block_storage
      priority: 90
      match:
        - minecraft:chest
        - minecraft:trapped_chest
        - minecraft:barrel
        - minecraft:ender_chest
        - minecraft:shulker_box
        - "*_shulker_box"
      assign:
        kind: block_storage
        value:
          default: common
          rare:
            - minecraft:trapped_chest
          epic:
            - minecraft:ender_chest
            - minecraft:shulker_box
            - "*_shulker_box"
        amount_class: 
          default: singleton
      reason: >
        Storage blocks are placeable, but their gameplay meaning is storage expansion, not generic block filler.

    - id: block_functional
      priority: 80
      match:
        - minecraft:campfire
        - minecraft:soul_campfire
        - minecraft:crafting_table
        - minecraft:furnace
        - minecraft:smoker
        - minecraft:blast_furnace
        - minecraft:brewing_stand
        - minecraft:cauldron
        - minecraft:enchanting_table
        - minecraft:anvil
        - minecraft:chipped_anvil
        - minecraft:damaged_anvil
        - minecraft:cartography_table
        - minecraft:fletching_table
        - minecraft:smithing_table
        - minecraft:grindstone
        - minecraft:stonecutter
        - minecraft:loom
        - minecraft:lectern
        - minecraft:composter
        - minecraft:bee_nest
        - minecraft:beehive
        - minecraft:lodestone
        - minecraft:beacon
        - minecraft:respawn_anchor
        - minecraft:bell
      assign:
        kind: block_functional
        value:
          default: rare
          uncommon:
            - minecraft:campfire
            - minecraft:crafting_table
            - minecraft:furnace
            - minecraft:smoker
            - minecraft:damaged_anvil
            - minecraft:stonecutter
            - minecraft:composter
          epic:
            - minecraft:enchanting_table
            - minecraft:beehive
            - minecraft:soul_campfire
            - minecraft:anvil
          unique:
            - minecraft:bee_nest
            - minecraft:beacon
            - minecraft:respawn_anchor
        amount_class:
          default: singleton
      reason: >
        Functional blocks unlock capabilities or systems and should usually appear as single meaningful finds.

    - id: block_technical
      priority: 70
      match:
        - minecraft:redstone_torch
        - minecraft:repeater
        - minecraft:comparator
        - minecraft:piston
        - minecraft:sticky_piston
        - minecraft:observer
        - minecraft:hopper
        - minecraft:dispenser
        - minecraft:dropper
        - minecraft:target
        - minecraft:lever
        - minecraft:lightning_rod
        - minecraft:daylight_detector
        - minecraft:calibrated_sculk_sensor
        - minecraft:tripwire_hook
        - minecraft:redstone_lamp
        - minecraft:note_block
        - minecraft:powered_rail
        - minecraft:detector_rail
        - minecraft:rail
        - minecraft:activator_rail
        - minecraft:crafter
        - minecraft:copper_bulb
        - minecraft:redstone_block
        - "*_button"
        - "*_pressure_plate"
        - "*_copper_bulb"
      assign:
        kind: block_technical
        value:
          default: rare
          common:
            - minecraft:rail
          uncommon:
            - minecraft:lever
            - minecraft:redstone_torch
            - minecraft:tripwire_hook
            - minecraft:powered_rail
            - "*_button"
            - "*_pressure_plate"
          epic:
            - minecraft:calibrated_sculk_sensor
            - minecraft:crafter
        amount_class:
          default: singleton
          tiny:
            - minecraft:tripwire_hook
            - minecraft:redstone_block
          small:
            - minecraft:redstone_torch
            - minecraft:redstone_lamp
            - minecraft:copper_bulb
          medium:
            - minecraft:powered_rail
            - minecraft:detector_rail
            - minecraft:activator_rail
          large:
            - minecraft:rail
      reason: >
        Technical blocks are not junk; they enable redstone and logistics systems and should be controlled accordingly.

    - id: block_utility
      priority: 60
      match:
        - minecraft:torch
        - minecraft:soul_torch
        - minecraft:lantern
        - minecraft:soul_lantern
        - minecraft:ladder
        - minecraft:scaffolding
        - minecraft:flower_pot
        - minecraft:end_rod
        - minecraft:bookshelf
        - minecraft:candle
        - "*_door"
        - "*_trapdoor"
        - "*_fence_gate"
        - "*_sign"
        - "*_hanging_sign"
        - "*_bed"
        - "*_candle"
        - "*_froglight"
      assign:
        kind: block_utility
        value:
          default: uncommon
          common:
            - minecraft:torch
            - minecraft:ladder
          rare:
            - minecraft:bookshelf
          epic:
            - "*_froglight"
        amount_class:
          default: small
          singleton:
            - minecraft:bookshelf
            - "*_bed"
      reason: >
        These are placeable but meaningfully useful; classify by behavior rather than by mere block form.

    - id: cosmetic_items
      priority: 40
      match:
        - minecraft:painting
        - minecraft:item_frame
        - minecraft:glow_item_frame
        - minecraft:armor_stand
        - minecraft:decorated_pot
        - minecraft:goat_horn
        - minecraft:jukebox
        - minecraft:chain
        - minecraft:sea_lantern
        - minecraft:sea_pickle
        - minecraft:shroomlight
        - minecraft:glowstone
        - minecraft:skeleton_skull
        - minecraft:wither_skeleton_skull
        - "*_banner"
        - "*_head"            
        - "music_disc_*"
        - "disc_fragment_*"
        - "*_banner_pattern"
        - "*_pottery_sherd"
        - "*_carpet"
      assign:
        kind: cosmetic
        value:
          default: uncommon
          rare:
            - minecraft:sea_lantern
          epic:
            - minecraft:wither_skeleton_skull
            - "*_head"
        amount_class:
          default: singleton
      reason: >
        Collectible, expressive, or prestige items should usually appear as singleton finds.

    - id: food_items
      priority: 35
      match:
        - "cooked_*"
        - "*_stew"
        - "#c:foods"
      assign:
        kind: food
        value:
          default: common
          rare:
            - minecraft:golden_carrot
            - minecraft:golden_apple
          epic:
            - minecraft:enchanted_golden_apple
        amount_class:
          default: small
          tiny:
            - minecraft:golden_carrot
            - minecraft:golden_apple
          singleton:
            - minecraft:enchanted_golden_apple
      reason: >
        Most food is ordinary sustain. Special-effect food deserves stronger rarity and smaller amounts.

    - id: magic_items
      priority: 30
      match:
        - minecraft:ender_pearl
        - minecraft:blaze_rod
        - minecraft:ghast_tear
        - minecraft:totem_of_undying
        - minecraft:potion              # specific rules needed for generated instances? (lots of other places like this)
        - minecraft:splash_potion
        - minecraft:lingering_potion
        - minecraft:experience_bottle
        - minecraft:ominous_bottle
        - minecraft:echo_shard
        - minecraft:enchanted_book
        - minecraft:wind_charge
        - minecraft:fire_charge
        - minecraft:breeze_rod
        - minecraft:ender_eye
        - minecraft:recovery_compass
      assign:
        kind: magic
        value:
          default: rare
          epic:
            - minecraft:totem_of_undying
            - minecraft:ender_eye
            - minecraft:echo_shard
          unique:
            - minecraft:recovery_compass
            - minecraft:ominous_bottle
        amount_class:
          default: small
          tiny:
            - minecraft:ghast_tear
            - minecraft:ender_eye
            - minecraft:echo_shard
          singleton:
            - minecraft:enchanted_book
            - minecraft:totem_of_undying
            - minecraft:recovery_compass
      reason: >
        Magic and progression items should be tightly controlled by both rarity and amount.

    - id: combat_items
      priority: 25
      match:
        - minecraft:bow
        - minecraft:crossbow
        - minecraft:shield
        - minecraft:trident
        - minecraft:mace
        - minecraft:arrow
        - minecraft:spectral_arrow
        - minecraft:tipped_arrow
        - minecraft:wolf_armor
        - minecraft:turtle_helmet
        - "*_sword"
        - "*_helmet"
        - "*_chestplate"
        - "*_leggings"
        - "*_boots"
        - "*_horse_armor"
      assign:
        kind: combat
        value:
          default: uncommon
          common:
            - minecraft:arrow
            - "#wooden"                     # Known issue: These style tags don't exist yet (probably want to add aa #c:equipment/wooden style tag)
            - "#stone"
            - "#leather"
          uncommon:
            - "#golden"
            - "#chainmail"
            - "#iron"
          rare:
            - minecraft:spectral_arrow
            - minecraft:tipped_arrow
            - minecraft:crossbow
            - minecraft:wolf_armor
            - minecraft:iron_horse_armor
            - minecraft:gold_horse_armor
            - minecraft:turtle_helmet
            - "#diamond"
          epic:
            - minecraft:trident
            - minecraft:mace
            - minecraft:diamond_horse_armor
            - "#netherite"
        amount_class:
          default: singleton
          large:
            - minecraft:arrow
          small:
            - minecraft:spectral_arrow
            - minecraft:tipped_arrow
      reason: >
        Durable combat gear should generally be singleton. Ammunition can stack higher.

    - id: tool_items
      priority: 20
      match:
        - minecraft:shears
        - minecraft:fishing_rod
        - minecraft:flint_and_steel
        - minecraft:spyglass
        - minecraft:compass
        - minecraft:clock
        - minecraft:map
        - minecraft:filled_map
        - minecraft:bucket
        - minecraft:bundle
        - minecraft:brush
        - "*_axe"
        - "*_pickaxe"
        - "*_shovel"
        - "*_hoe"
        - "*_bucket"
      assign:
        kind: tool
        value:
          default: uncommon
          none:
            - minecraft:stone_pickaxe   # Because of primity mod
            - minecraft:filled_map      # I don't think player is supposed to get these
            - "#wooden"                 # Because of primity mod            
          common:                       #   Also, known issue: These style tags don't exist yet (probably want to add aa #c:equipment/wooden style tag)
            - "#stone"
            - "#copper"
          uncommon:
            - minecraft:spyglass
            - minecraft:bucket
            - "#golden"
            - "#iron"
          rare:
            - minecraft:compass
            - minecraft:clock
            - minecraft:map
            - "#diamond"
            - "*_bucket"
          epic:
            - "#netherite"
        amount_class:
          default: singleton
          small:
            - minecraft:map
      reason: >
        Durable tools and utility implements should generally appear one at a time.

    - id: plantable_items
      priority: 16
      match:
        - minecraft:potato
        - minecraft:sugar_cane
        - minecraft:bamboo
        - minecraft:cocoa_beans
        - "*_seeds"
        - "*_sapling"
      assign:
        kind: plantable
        value:
          default: uncommon
        amount_class:
          default: small
      reason: >
        Things the player can plant.

    - id: material_items
      priority: 15
      match:
        # Common
        - minecraft:coal
        - minecraft:charcoal
        - minecraft:glass
        - minecraft:glass_pane
        - minecraft:clay_ball
        - minecraft:brick
        - minecraft:string
        - minecraft:feather
        - minecraft:wheat
        - minecraft:ink_sac
        - minecraft:bone
        - minecraft:sugar                   # food_ingredient?
        - minecraft:egg                     # food_ingredient?
        - minecraft:melon                   # food_ingredient?
        - minecraft:leather
        - minecraft:flint
        # Uncommon
        - minecraft:glowstone_dust
        - minecraft:lapis_lazuli
        - minecraft:quartz
        - minecraft:redstone
        - minecraft:amethyst_shard
        - minecraft:slime_ball
        - minecraft:paper
        - minecraft:book
        - minecraft:rabbit_hide
        - minecraft:gunpowder
        - minecraft:spider_eye
        - minecraft:cobweb
        - minecraft:honeycomb
        - minecraft:coal_block
        - minecraft:copper_block
        # Rare
        - minecraft:diamond
        - minecraft:emerald
        - minecraft:glow_ink_sac
        - minecraft:nether_wart
        - minecraft:fermented_spider_eye
        - minecraft:phantom_membrane
        - minecraft:blaze_powder
        - minecraft:magma_cream
        - minecraft:glistering_melon_slice
        - minecraft:prismarine_shard
        - minecraft:prismarine_crystals
        - minecraft:armadillo_scute
        - minecraft:iron_block
        - minecraft:gold_block
        - minecraft:lapis_block
        - minecraft:turtle_egg
        - minecraft:turtle_scute
        - minecraft:dragon_breath
        # Epic
        - minecraft:diamond_block
        - minecraft:emerald_block
        - minecraft:heart_of_the_sea
        - minecraft:rabbit_foot
        - minecraft:netherite_scrap
        - minecraft:chorus_plant
        - minecraft:chorus_flower
        - minecraft:silence_armor_trim_smithing_template
        - minecraft:netherite_upgrade_smithing_template
        # Unique
        - minecraft:end_crystal
        - minecraft:wither_rose
        - minecraft:heavy_core
        - minecraft:nether_star
        # Filters
        - "*_ingot"
        - "*_bars"
        - "*_nugget"
        - "*_ore"
        - "raw_*"
        - "*_wool"
        - "*_concrete_powder"
        - "*_dye"
        - "*_mushroom"
        - "*_fungus"
        - "*_armor_trim_smithing_template"
      assign:
        kind: material
        value:
          default: rare
          common:
            - minecraft:coal
            - minecraft:charcoal
            - minecraft:glass
            - minecraft:glass_pane
            - minecraft:clay_ball
            - minecraft:brick
            - minecraft:string
            - minecraft:feather
            - minecraft:wheat
            - minecraft:ink_sac
            - minecraft:bone
            - minecraft:sugar
            - minecraft:egg
            - minecraft:melon
            - minecraft:leather
            - minecraft:flint
            - "#copper"                 # Known issue: These style tags don't exist yet (probably want to add aa #c:metals/copper style tag)
            - "*_wool"
            - "*_mushroom"
            - "*_fungus"
            - "*_concrete_powder"
          uncommon:
            - minecraft:glowstone_dust
            - minecraft:lapis_lazuli
            - minecraft:quartz
            - minecraft:redstone
            - minecraft:amethyst_shard
            - minecraft:slime_ball
            - minecraft:paper
            - minecraft:book
            - minecraft:rabbit_hide
            - minecraft:gunpowder
            - minecraft:spider_eye
            - minecraft:cobweb
            - minecraft:honeycomb
            - minecraft:coal_block
            - minecraft:copper_block
            - "#iron"
            - "#gold"
            - "*_dye"
          epic:
            - minecraft:diamond_block
            - minecraft:emerald_block
            - minecraft:heart_of_the_sea
            - minecraft:rabbit_foot
            - minecraft:netherite_scrap
            - minecraft:chorus_plant
            - minecraft:chorus_flower
            - minecraft:silence_armor_trim_smithing_template
            - minecraft:netherite_upgrade_smithing_template
          unique:
            - minecraft:netherite_ingot
            - minecraft:end_crystal
            - minecraft:wither_rose
            - minecraft:heavy_core
            - minecraft:nether_star
        amount_class:
          default: small
          singleton:
            - minecraft:book
            - minecraft:armadillo_scute
            - minecraft:turtle_scute
            - minecraft:heart_of_the_sea
            - minecraft:end_crystal
            - minecraft:wither_rose
            - minecraft:netherite_ingot
            - minecraft:silence_armor_trim_smithing_template
            - minecraft:netherite_upgrade_smithing_template
          tiny:
            - minecraft:diamond_block
            - minecraft:emerald_block
            - minecraft:netherite_scrap
            - minecraft:clay_ball
            - minecraft:brick
            - "*_armor_trim_smithing_template"
          medium:
            - minecraft:glass
            - minecraft:redstone
            - minecraft:coal
            - minecraft:charcoal
            - minecraft:bone
            - minecraft:wheat
            - "raw_*"
      reason: >
        Materials are primarily economy inputs. Rare compact-value materials stay small; bulk basics can stack higher.

    - id: utility_items
      priority: 10
      match:
        - minecraft:saddle
        - minecraft:minecart
        - minecraft:tnt
        - minecraft:carrot_on_a_stick
        - minecraft:warped_fungus_on_a_stick
        - minecraft:elytra
        - minecraft:glass_bottle
        - minecraft:writable_book
        - minecraft:written_book
        - minecraft:firework_rocket
        - minecraft:firework_star
        - minecraft:bowl
        - minecraft:lead
        - minecraft:sponge
        - minecraft:wet_sponge
        - minecraft:hay_block
        - minecraft:name_tag
        - minecraft:bone_meal
        - minecraft:trial_key
        - minecraft:ominous_trial_key
        - "*_boat"
        - "*_chest_boat"
        - "*_raft"
        - "*_chest_raft"
        - "*_minecart"
      assign:
        kind: utility
        value:
          default: rare
          common:
            - minecraft:bone_meal
            - minecraft:bowl
            - minecraft:glass_bottle
          uncommon:
            - minecraft:saddle
            - minecraft:minecart
            - minecraft:firework_rocket
            - minecraft:lead
          epic:
            - minecraft:sponge
            - minecraft:wet_sponge
            - minecraft:warped_fungus_on_a_stick
            - minecraft:trial_key
          unique:
            - minecraft:elytra
            - minecraft:ominous_trial_key
        amount_class:
          default: singleton
          tiny:
            - minecraft:sponge
            - minecraft:wet_sponge
            - minecraft:hay_block
          small:
            - minecraft:tnt
            - minecraft:glass_bottle
            - minecraft:firework_rocket
            - minecraft:firework_star
            - minecraft:bone_meal
      reason: >
        Utility items are useful but not all are progression-breaking. Durable or high-impact utility should usually be singleton.

    - id: block_building
      priority: 50
      match:
        - minecraft:terracotta
        - minecraft:concrete
        - minecraft:amethyst_block
        - minecraft:quartz_block
        - "*_slab"
        - "*_stairs"
        - "*_wall"
        - "*_fence"
        - "*_gate"
        - "*_bricks"
        - "*_grate"
        - "*_pillar"
        - "*_tiles"
        - "chiseled_*"
        - "cut_*"
        - "smooth_*"
        - "polished_*"
        - "bamboo_*"
        - "exposed_*"
        - "weathered_*"
        - "oxidized_*"
        - "waxed_*"
        - "*_glass*"      # Hopefully catches colored variants
        - "*_terracotta"  # Hopefully catches colored variants
        - "*_concrete"    # Hopefully catches colored variants
      assign:
        value:
          default: filler
          rare:
            - minecraft:amethyst_block
            - minecraft:quartz_block
        kind: block_building
        amount_class: 
          default: bulk
      reason: >
        Structural or decorative blocks that are somewhat useful filler

    - id: block_raw
      priority: 45
      match:
        - minecraft:stone
        - minecraft:gravel
        - minecraft:sand
        - minecraft:soul_sand
        - minecraft:soul_soil
        - minecraft:netherite_block
        - minecraft:ice
        - minecraft:clay
        - minecraft:moss_block
        - minecraft:amethyst_cluster
        - minecraft:ancient_debris
        - minecraft:cactus
        - minecraft:stick
        - minecraft:cobbled_deepslate
        - minecraft:cobblestone
        - minecraft:dripstone_block
        - minecraft:pointed_dripstone
        - minecraft:slime_block
        - minecraft:vine
        - minecraft:magma_block
        - minecraft:obsidian
        - minecraft:packed_ice
        - minecraft:blue_ice
        - minecraft:prismarine
        - minecraft:dark_prismarine
        - minecraft:purpur_block
        - "*_log"
        - "*_wood"
        - "*_planks"
        - "*_coral*"
        - "*_amethyst_bud"
      assign:
        value:
          default: junk
          uncommon:
            - minecraft:pointed_dripstone
            - minecraft:dripstone_block
            - minecraft:magma_block
            - minecraft:packed_ice
          rare:
            - minecraft:slime_block
            - minecraft:amethyst_cluster
            - minecraft:obsidian
            - minecraft:blue_ice
            - minecraft:prismarine
            - minecraft:dark_prismarine
          epic:
            - minecraft:ancient_debris
            - minecraft:netherite_block
        kind: block_raw
        amount_class:
          default: large
          bulk:
            - "*_planks"
          small:
            - "*_log"
            - "*_wood"
      reason: >
        Raw material blocks that are somewhat useful filler

    - id: block_junk
      priority: 40
      match:
        - minecraft:granite
        - minecraft:diorite
        - minecraft:andesite
        - minecraft:deepslate
        - minecraft:calcite
        - minecraft:tuff
        - minecraft:grass_block
        - minecraft:dirt
        - minecraft:coarse_dirt
        - minecraft:podzol
        - minecraft:rooted_dirt
        - minecraft:mycelium
        - minecraft:packed_mud
        - minecraft:netherrack
        - minecraft:crying_obsidian
        - minecraft:mud
        - minecraft:blackstone
        - minecraft:basalt
        - minecraft:end_stone
        - "*_leaves"
        - "infested_*"
      assign:
        value:
          default: junk
        kind: block_junk
        amount_class:
          default: chaotic
      reason: >
        High-volume common blocks filler that is practically worthless

    - id: fallback
      priority: 0
      match:
        summary: any item not matched above
      assign:
        value:
          default: none
        kind: unmatched
        amount_class:
          default: singleton
      reason: >
        Conservative fallback for uncategorized items pending manual review.

  affinity_rules:
    - id: affinity_end
      priority: 50
      match:
        - minecraft:chorus_flower
        - "#c:end_materials"
      add: end

    - id: affinity_nether
      priority: 50
      match:
