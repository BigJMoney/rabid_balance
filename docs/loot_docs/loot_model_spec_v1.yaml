A whole other prototype:

"Instead of mapping affinity directly to loot context values, have an intermediate 
policy document:

  affinity_policy:
  village:
    favor:
      structure_class: [village, settlement]
  sea:
    favor:
      realm: [ocean]
      activity: [fishing, sailing]
  desert:
    favor:
      environment: [desert]
  end:
    disfavor:
      realm: [overworld, nether]
    favor:
      realm: [end]

This would allow easier global tweaking"


