        - minecraft:bundle
        - minecraft:brush
        - "*_axe"
        - "*_pickaxe"
        - "*_shovel"
        - "*_hoe"
        - "*_bucket"
      assign:
        kind: tool
        value:
          default: uncommon
          none:
            - minecraft:stone_pickaxe   # Because of primity mod
            - minecraft:filled_map      # I don't think player is supposed to get these
            - "#wooden"                 # Because of primity mod            
          common:                       #   Also, known issue: These style tags don't exist yet (probably want to add aa #c:equipment/wooden style tag)
            - "#stone"
            - "#copper"
          uncommon:
            - minecraft:spyglass
            - minecraft:bucket
            - "#golden"
            - "#iron"
          rare:
            - minecraft:compass
            - minecraft:clock
            - minecraft:map
            - "#diamond"
            - "*_bucket"
          epic:
            - "#netherite"
        amount_class:
          default: singleton
          small:
            - minecraft:map
      reason: >
        Durable tools and utility implements should generally appear one at a time.

    - id: material_items
      priority: 15
      match:
        # Common
        - minecraft:coal
        - minecraft:charcoal
        - minecraft:glass
        - minecraft:glass_pane
        - minecraft:clay_ball
        - minecraft:brick
